name: CI APK build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (ciDebug or ciRelease)"
        required: true
        default: "ciDebug"
        type: choice
        options:
          - ciDebug
          - ciRelease

permissions:
  contents: read

concurrency:
  group: ci-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build CI APK
        run: ./gradlew :app:assembleCiDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          APK_PATH="app/build/outputs/apk/ci/debug/app-ci-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          SHA=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "APK_SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "APK size: $SIZE bytes"
          echo "APK SHA-256: $SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidharness-ci-debug-apk
          path: app/build/outputs/apk/ci/debug/app-ci-debug.apk
          retention-days: 30
